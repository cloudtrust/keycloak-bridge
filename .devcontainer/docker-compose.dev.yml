services:
  bridge:
    container_name: dev-bridge
    image: mcr.microsoft.com/devcontainers/go:2.3.2-1.27@sha256:06ae646a1f1ec51551e5abd15954f9279939953eeb74482052efcaaad526ab0d
    ports:
      - "8899:8899"
      - "8888:8888"
      - "8877:8877"
      - "8866:8866"
      - "8855:8855"
      - "8844:8844"
      - "8870:8870"
    volumes:
      - ${BRIDGE_REPOSITORY_FOLDER}:/workspace:cached
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
