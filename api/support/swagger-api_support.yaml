openapi: 3.0.1
info:
  title: Swagger Cloudtrust Management
  description: 'Support API for Cloudtrust.'
  version: 1.0.0
servers:
- url: http://localhost:8888
tags:
- name: Support
  description: Support helpers
paths:
  /support/accounts:
    get:
      tags:
      - Support
      summary: Get account information according to a given email
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation (the body is null instead of [] when the list is empty)
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/EmailInfo'
        400:
          description: missing or invalid email parameter
        404:
          description: no account found for this email
components:
  schemas:
    EmailInfo:
      type: object
      properties:
        realm:
          type: string
        creationDate:
          type: integer
          format: int64
          description: creation date in seconds since epoch
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: http://toto.com/.well-known/openid-configuration
security:
  - openId:
    - todo