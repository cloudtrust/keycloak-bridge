openapi: 3.0.1
info:
  title: Swagger Cloudtrust Management
  description: 'Statistics API for Cloudtrust.'
  version: 1.0.0
servers:
- url: http://localhost:8877
tags:
- name: Statistics
  description: Statistics management
paths:
  /statistics/actions:
    get:
      tags:
      - Actions
      summary: Get the list of all possible actions
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actions'
        403:
          description: not allowed
  /statistics/realms/{realm}/identifications:
    get:
      tags:
      - Statistics
      summary: Get the identification statistics for a realm
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentificationStatistics'
        403:
          description: not allowed
  /statistics/realms/{realm}/users:
    get:
      tags:
      - Statistics
      summary: Get the statistics on the users, for a certain realm
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsUsers'
        403:
          description: not allowed
  /statistics/realms/{realm}/authenticators:
    get:
      tags:
      - Statistics
      summary: Get the statistics on the authenticators used by the users, for a certain realm
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsAuthenticators'
        403:
          description: not allowed
  /statistics/realms/{realm}/migration:
    get:
      tags:
      - Statistics
      summary: Get the migration report of the users of a certain realm
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationReport'
        403:
          description: not allowed
components:
  schemas:
    Actions:
      type: object
      properties:
        name:
          type: string
        scope:
          type: string
    IdentificationStatistics:
      type: object
      properties:
        videoIdentifications:
          type: integer
        physicalIdentifications:
          type: integer
        autoIdentifications:
          type: integer
        basicIdentifications:
          type: integer
    StatisticsUsers:
      type: object
      properties:
        total:
          type: integer
          format: int64
        disabled:
          type: integer
          format: int64
        inactive:
          type: integer
          format: int64
    StatisticsAuthenticators:
      type: object
      additionalProperties:
        type: integer
        format: int64
    MigrationReport:
      type: object
      description: map of username to migration status (true if the user has been migrated)
      additionalProperties:
        type: boolean
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: http://toto.com/.well-known/openid-configuration
security:
  - openId:
    - todo