openapi: 3.0.1
info:
  title: Swagger Cloudtrust Validation Check (KYC)
  description: 'Internal API Validation Check for Cloudtrust.'
  version: 1.0.0
servers:
- url: http://localhost:8888
tags:
- name: UserData
  description: User data information
paths:
  /validation/realms/{realm}/users/{userID}:
    get:
      tags:
      - UserData
      summary: Get user data information
      parameters:
      - name: realm
        in: path
        description: Realm name (not id!)
        required: true
        schema:
          type: string
      - name: userID
        in: path
        description: userID to retrieve
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: invalid path parameter
        404:
          description: user not found (Keycloak error status is passed through)
    put:
      tags:
      - UserData
      summary: Updates user data information
      parameters:
      - name: realm
        in: path
        description: Realm name (not id!)
        required: true
        schema:
          type: string
      - name: userID
        in: path
        description: userID of user to update
        required: true
        schema:
          type: string
      - name: txnID
        in: query
        description: transaction ID (linked in events)
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: successful operation
        400:
          description: invalid parameter, invalid body or body validation failed
        404:
          description: user not found (Keycloak error status is passed through)
  /validation/realms/{realm}/users/{userID}/accreditations:
    put:
      tags:
      - UserData
      summary: Adds an accreditation
      parameters:
      - name: realm
        in: path
        description: Realm name (not id!)
        required: true
        schema:
          type: string
      - name: userID
        in: path
        description: userID of user to update
        required: true
        schema:
          type: string
      - name: sponsors
        in: query
        description: sponsors of the granted accreditations
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Accreditation'
      responses:
        200:
          description: successful operation
        400:
          description: invalid parameter, invalid body or body validation failed
        404:
          description: user not found (Keycloak error status is passed through)
  /validation/realms/{realm}/users/{userID}/groups:
    get:
      tags:
      - UserData
      summary: Get groups of user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: userID
        in: path
        description: User id
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        400:
          description: invalid path parameter
        404:
          description: user not found (Keycloak error status is passed through)
  /validation/realms/{realm}/users/{userID}/roles:
    get:
      tags:
      - UserData
      summary: Get roles of user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: userID
        in: path
        description: User id
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        400:
          description: invalid path parameter
        404:
          description: user not found (Keycloak error status is passed through)
components:
  schemas:
    Accreditation:
      type: object
      required: [name, validity]
      properties:
        name:
          type: string
        validity:
          type: string
          description: validity duration (combination of number+unit with unit in y, m, w, d), e.g. 2y, 6m, 1y6m
          pattern: '^([1-9]\d*[ymwd])+$'
    User:
      type: object
      description: required fields are defined by the realm user profile
      properties:
        id:
          type: string
        username:
          type: string
        gender:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          readOnly: true
          description: only filled in GET user
        phoneNumber:
          type: string
        phoneNumberVerified:
          type: boolean
          readOnly: true
          description: only filled in GET user
        locale:
          type: string
          description: only filled in GET user
        birthDate:
          type: string
          format: date-time
          description: RFC3339 date-time
        birthLocation:
          type: string
        nationality:
          type: string
          description: ISO 3166 Alpha-2 country code
        idDocumentType:
          type: string
          enum: [ID_CARD, PASSPORT, RESIDENCE_PERMIT]
        idDocumentNumber:
          type: string
        idDocumentExpiration:
          type: string
          format: date-time
          description: RFC3339 date-time
        idDocumentCountry:
          type: string
          description: ISO 3166 Alpha-2 country code
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
security:
  - basicAuth: []