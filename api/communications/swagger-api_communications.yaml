openapi: 3.0.1
info:
  title: Swagger Cloudtrust Communications
  description: 'Communications API for Cloudtrust'
  version: 1.0.0
servers:
- url: http://localhost:8888/communications
tags:
- name: Email
  description: Send Emails
- name: SMS
  description: Send SMS
paths:
  /realms/{realm}/users/{userID}/send-email:
    post:
      tags:
      - Email
      summary: Send an email to a user (specified by userID)
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: userID
        in: path
        description: user id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRepresentation'
      responses:
        204:
          description: successful operation
        400:
          description: invalid path parameter, invalid body or body validation failed
  /realms/{realm}/send-sms:
    post:
      tags:
      - SMS
      summary: Send SMS to the user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMSRepresentation'
      responses:
        200:
          description: successful operation
        400:
          description: invalid path parameter, invalid body or body validation failed

components:
  schemas:
    EmailRepresentation:
      type: object
      required: [theming]
      properties:
        recipient:
          type: string
          description: optional email address
        theming:
          type: object
          required: [subjectKey]
          properties:
            subjectKey:
              type: string
            subjectParameters:
              type: array
              items:
                type: string
            template:
              type: string
            templateParameters:
              type: object
              additionalProperties:
                type: string
            locale:
              type: string
            themeRealmName:
              type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              contentType:
                type: string
              content:
                type: string
    SMSRepresentation:
      type: object
      required: [msisdn, theming]
      properties:
        msisdn:
          type: string
          description: phone number
        theming:
          type: object
          properties:
            messageKey:
              type: string
            messageParameters:
              type: array
              items:
                type: string
            locale:
              type: string
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: http://toto.com/.well-known/openid-configuration
security:
  - openId:
    - todo