openapi: 3.0.1
info:
  title: Swagger Cloudtrust Account
  description: 'API Self service for Cloudtrust.'
  version: 1.0.0
servers:
- url: http://localhost:8866
paths:
  /account:
    get:
      tags:
      - Account
      summary: Get account representation of the current user
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    post:
      tags:
      - Account
      summary: Update account representation of the current user. Input is validated against the realm users profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        200:
          description: successful operation
        400:
          description: Invalid body, body does not match the realm users profile or tried to update a read-only field (update-read-only-field)
        403:
          description: Account editing is disabled for the realm
    delete:
      tags:
      - Account
      summary: Delete account
      responses:
        200:
          description: successful operation
        403:
          description: Account deletion is disabled for the realm
  /account/configuration:
    get:
      tags:
      - Configuration
      summary: Get self-service configuration. Realm query parameter is used to override some configuration parameters with the value specified for the realm
      parameters:
      - name: realm_id
        in: query
        schema:
          type: string
        allowEmptyValue: true
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
  /account/credentials:
    get:
      tags:
      - Credentials
      summary: Get list of credentials of the user.
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
  /account/credentials/password:
    post:
      tags:
      - Credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassword'
      summary: Update password
      responses:
        200:
          description: The password has been updated
        400:
          description: Bad parameters (same old and new passwords, different new and confirm passwords, ...)
        403:
          description: Callers are not allowed to change a password for this realm
  /account/credentials/registrators:
    get:
      tags:
      - Credentials
      summary: Get all registrators available for the user
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistratorId'
  /account/credentials/{credentialId}:
    put:
      tags:
      - Credentials
      summary: Update UserLabel of credential (all other attributes will be ignored)
      parameters:
      - name: credentialId
        in: path
        description: id of the credential
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credential'
      responses:
        200:
          description: Successfuly updated.
        400:
          description: Invalid body or missing userLabel
    delete:
      tags:
      - Credentials
      summary: Delete the credential
      parameters:
      - name: credentialId
        in: path
        description: id of the credential
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
        400:
          description: The credential can't be removed (cantRemovePassword when it is the password, notEnoughMFA when it is the last MFA of the user)
        403:
          description: Authenticator deletion is disabled for the realm
        404:
          description: Unknown credential
  /account/credentials/{credentialId}/after/{previousCredentialId}:
    post:
      tags:
      - Credentials
      summary: Change priority order among credentials
      parameters:
      - name: credentialId
        in: path
        description: id of the credential to move
        required: true
        schema:
          type: string
      - name: previousCredentialId
        in: path
        description: id of the credential before the moved one. Use 'null' to move the credential at the top of the list.
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successful operation.
  /account/profile:
    get:
      tags:
      - Profile
      summary: Gets the definition of user attributes
      responses:
        200:
          description: successful operation. Returns the realm users profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /account/verify-email:
    put:
      tags:
      - Account
      summary: Request an email verification
      responses:
        200:
          description: successful operation
  /account/verify-phone-number:
    put:
      tags:
      - Account
      summary: Request a phone number verification
      responses:
        200:
          description: successful operation
  /account/cancel-email-change:
    put:
      tags:
      - Account
      summary: Cancels a change of email address
      responses:
        200:
          description: successful operation
  /account/cancel-phone-number-change:
    put:
      tags:
      - Account
      summary: Cancels a change of phone number
      responses:
        200:
          description: successful operation
  /account/linked-accounts:
    get:
      tags:
      - Account
      summary: Get the list of accounts linked to the current user
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedAccount'
        403:
          description: IDP links management is disabled for the realm
  /account/linked-accounts/{providerAlias}:
    delete:
      tags:
      - Account
      summary: Delete the linked account
      parameters:
        - name: providerAlias
          in: path
          description: alias of the login provider
          required: true
          schema:
            type: string
      responses:
        200:
          description: successful operation
        403:
          description: IDP links management is disabled for the realm
  /account/can-identify:
    get:
      tags:
      - Account
      summary: Get if the user can be identified (with a soon expiring accreditation or not accredited)
      parameters:
      - name: context-key
        in: query
        description: context key to check the accreditation for. If not provided, DEP will be used
        required: false
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: boolean
components:
  schemas:
    UpdatePassword:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string
    Credential:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        userLabel:
          type: string
        createdDate:
          type: integer
          format: int64
        credentialData:
          type: string
          description: JSON serialized credential data
        temporary:
          type: boolean
    RegistratorId:
      type: string
    Account:
      type: object
      description: Account of the current user.
      additionalProperties: true
      properties:
        username:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          description: only returned by /account
        emailToValidate:
          type: string
          description: Read only. Email requested to be the email of the user but not yet validated
        gender:
          type: string
          description: only returned by /account
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        phoneNumberVerified:
          type: boolean
          description: only returned by /account
        phoneNumberToValidate:
          type: string
          description: Read only. Phone number requested to be the phone number of the user but not yet validated
        birthDate:
          type: string
          description: only returned by /account. format is DD.MM.YYYY
        birthLocation:
          type: string
          description: only returned by /account
        nationality:
          type: string
          description: ISO 3166 Alpha-2 country code
        idDocumentType:
          type: string
          enum: [ID_CARD, PASSPORT, RESIDENCE_PERMIT]
          description: only returned by /account
        idDocumentNumber:
          type: string
          description: only returned by /account
        idDocumentExpiration:
          type: string
          description: only returned by /account
        idDocumentCountry:
          type: string
          description: ISO 3166 Alpha-2 country code
        locale:
          type: string
        businessId:
          type: string
          description: Business identifier (can be GLN)
        accreditations:
          type: array
          description: only returned by /account
          items:
            $ref: '#/components/schemas/Accreditation'
        pendingChecks:
          type: array
          description: Only used by getUser. Names of the pending identification checks of the user
          items:
            type: string
    Accreditation:
      type: object
      properties:
        type:
          type: string
          description: accreditation type
        expiryDate:
          type: string
          description: expiry date. format is DD.MM.YYYY
        expired:
          type: boolean
          description: true if the expiry date has passed
        revoked:
          type: boolean
          description: true if the accreditation has been revoked
    Configuration:
      type: object
      properties:
        editing_enabled:
          type: boolean
        show_authenticators_tab:
          type: boolean
        show_password_tab:
          type: boolean
        show_profile_tab:
          type: boolean
        show_account_deletion_button:
          type: boolean
        show_idplinks_tab:
          type: boolean
        self_service_default_tab:
          type: string
        redirect_successful_registration_url:
          type: string
        available-checks:
          type: object
          additionalProperties:
            type: boolean
        barcode_type:
          type: string
          enum: [CODE128]
        onboarding_user_editing_enabled:
          type: boolean
        theme:
          type: string
        supportedLocales:
          type: array
          description: only provided when internationalization is enabled for the realm
          items:
            type: string
        video_identification_voucher_enabled:
          type: boolean
        video_identification_accounting_enabled:
          type: boolean
        video_identification_prepayment_required:
          type: boolean
        auto_identification_voucher_enabled:
          type: boolean
        auto_identification_accounting_enabled:
          type: boolean
        auto_identification_prepayment_required:
          type: boolean
        video_identification_allowed_roles:
          type: array
          items:
            type: string
        auxiliary_video_identification_allowed_roles:
          type: array
          items:
            type: string
        auto_identification_allowed_roles:
          type: array
          items:
            type: string
        physical_identification_allowed_roles:
          type: array
          items:
            type: string
        allowed_back_urls:
          type: array
          items:
            type: string
        allow_initial_password_definition:
          type: boolean
        identification_url:
          type: string
        bo_external_idp_management_enabled:
          type: boolean
    LinkedAccount:
      type: object
      properties:
        connected:
          type: boolean
        social:
          type: boolean
        providerAlias:
          type: string
        providerName:
          type: string
        displayName:
          type: string
        linkedUsername:
          type: string
    Profile:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProfileAttribute'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProfileGroup'
          description: groups are used to gather user attributes by themes
    ProfileAttribute:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        group:
          type: string
          description: name of a group defined in ProfileGroup
        required:
          type: boolean
        readOnly:
          type: boolean
        validations:
          $ref: '#/components/schemas/ProfileAttributeValidations'
        annotations:
          type: object
          additionalProperties:
            type: string
    ProfileAttributeValidations:
      description: >
        Here is a list of known validators :
        email: no parameters
        length: min/max (can be integer or string), trim-disabled (boolean as string)
        integer: min/max (integer as string)
        double: min/max (integer as string)
        options: options (array of allowed values)
        pattern: pattern (regex), error-message (string)
        local-date: no parameters
        uri: no parameters
        username-prohibited-characters: error-message (string)
        person-name-prohibited-characters: error-message (string)
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ProfileAttributeValidator'
    ProfileAttributeValidator:
      type: object
      additionalProperties:
        type: object
    ProfileGroup:
      type: object
      properties:
        name:
          type: string
        displayHeader:
          type: string
        displayDescription:
          type: string
        annotations:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: http://toto.com/.well-known/openid-configuration
security:
  - openId:
    - todo