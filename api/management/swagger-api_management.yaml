  /realms/{realm}/theme-configuration:
    get:
      tags:
      - Configuration
      summary: >
        Get the theme configuration for the Backoffice
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: Theme Configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    description: Various settings for the theme
                    properties:
                      color:
                        type: string
                        description: Hex color code (e.g. \#FFFFFF)
                      menuTheme:
                        type: string
                        description: Name of the menu theme to use (either 'light', 'dark' or 'primary')
                      fontFamily:
                        type: string
                        description: Font family to use for the theme
                  logo:
                    type: string
                    description: data URI of the logo image in base64 format
                  favicon:
                    type: string
                    description: data URI of the favicon image in base64 format
    put:
      tags:
      - Configuration
      summary: >
        Update the theme configuration for the Backoffice.
        The theme configuration of the realm given in the path is always the one updated.
      parameters:
      - name: realm
        in: path
        description: realm name (not id!). This is the realm whose theme configuration is updated.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeConfiguration'
      responses:
        200:
          description: successful operation (empty body)
        400:
          description: invalid body (e.g. missing realmName or settings, invalid color, menu theme, font family, image or translations)
