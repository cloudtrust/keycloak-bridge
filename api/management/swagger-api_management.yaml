        The username is always generated (any provided username is ignored) and terms of use are always required.
        Role and Groups can be assigned thanks to their ID.
      parameters:
      - name: generateNameID
        in: query
        description: tells if a NameID should be generated
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/User'
              - type: object
                required:
                - groups
      responses:
        201:
          description: successful operation
          headers:
            Location:
              schema:
                type: string
              description: URL of the new resource.
        400:
          description: invalid body or missing groups
        409:
          description: a user with the same email already exists in the social realm
  /social/users/{userID}/send-onboarding-email:
    post:
      tags:
      - Users
      summary: >
        Send an onboarding email to the user. He will receives an email to start the onboarding process. At the end of the process, he will be authenticated.
      parameters:
      - name: userID
        in: path
        description: User id
        required: true
        schema:
          type: string
      - name: lifespan
        in: query
        description: validity duration of the link sent in the mail in seconds. If value exceeds the configured max life span, you can get a HTTP status 400.
        required: false
        schema:
          type: integer
      - name: reminder
        in: query
        required: false
        schema:
          type: boolean
      - name: customerRealm
        in: query
        description: Customer realm name
        required: false
        schema:
          type: string
      - name: custom1
        in: query
        schema:
          type: string
      - name: custom2
        in: query
        schema:
          type: string
      - name: custom3
        in: query
        schema:
          type: string
      - name: custom4
        in: query
        schema:
          type: string
      - name: custom5
        in: query
        schema:
          type: string
      responses:
        200:
          description: Onboarding email sent
        400:
          description: Invalid input
        401:
          description: Not authenticated
        403:
          description: No permission to call this operation
        409:
          description: Endpoint not configured
components:
  schemas:
    Actions:
      type: object
      properties:
