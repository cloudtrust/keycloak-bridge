          type: string
        scope:
          type: string
    Realm:
      type: object
      properties:
        id:
          type: string
        keycloakVersion:
          type: string
        realm:
          type: string
        displayName:
          type: string
        enabled:
          type: boolean
          default: true
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        gender:
          type: string
          enum: [M,F,U]
          description: Male, Female or Undefined
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          description: When updating, explicitly set email to null to remove this value. To keep it untouched, don't provide the field.
        emailVerified:
          type: boolean
          default: false
        emailToValidate:
          type: string
          description: Read only. Email requested to be the email of the user but not yet validated
        phoneNumber:
          type: string
          description: When updating, explicitly set phone number to null to remove this value. To keep it untouched, don't provide the field.
        phoneNumberVerified:
          type: boolean
          default: false
        phoneNumberToValidate:
          type: string
          description: Read only. Phone number requested to be the phone number of the user but not yet validated
        birthDate:
          type: string
          description: format is DD.MM.YYYY
        birthLocation:
          type: string
        nationality:
          type: string
          description: ISO 3166 Alpha-2 country code
        idDocumentType:
          type: string
          enum: [ID_CARD, PASSPORT, RESIDENCE_PERMIT]
        idDocumentNumber:
          type: string
        idDocumentExpiration:
          type: string
        idDocumentCountry:
          type: string
          description: ISO 3166 Alpha-2 country code
        groups:
          type: array
          items:
            type: string
        trustIdGroups:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        locale:
          type: string
          default: "en"
        businessId:
          type: string
          description: Business identifier (can be GLN)
        smsSent:
          type: integer
        smsAttempts:
          type: integer
        enabled:
          type: boolean
          default: true
        label:
          type: string
        pendingChecks:
          type: array
          description: Used only by getUser
          items:
            type: string
        accreditations:
          type: array
          description: Used only by getUser
          items:
            type: object
            properties:
              type:
                type: string
                description: accreditation type
              expiryDate:
                type: string
                description: expiry date. format is DD.MM.YYYY
              expired:
                type: boolean
                description: true if the expiry date has passed
              revoked:
                type: boolean
                description: true if the accreditation has been revoked for any reason (example. personal information updated after accreditation)
        nameId:
          type: string
          description: Used only by getUser
        onboardingCompleted:
          type: boolean
          description: Used only by getUser. Tells if onboarding is completed
        createdTimestamp:
          type: integer
          format: int64
        onboardingStatus:
          type: string
          enum: ["", self-registration-form-completed, user-created-by-api, email-verified, password-set, phone-verified, 2fa-set, completed]
          description: user onboarding flow status
      additionalProperties:
        description: Dynamic attributes defined by the realm user profile are also serialized as top-level fields.
    UserCheck:
      type: object
      properties:
        operator:
          type: string
        checkDate:
          type: string
          description: check date. format is DD.MM.YYYY
        status:
          type: string
        type:
          type: string
        nature:
          type: string
        proofType:
          type: string
        comment:
          type: string
    UserStatus:
      type: object
      properties:
        email:
          type: string
        enabled:
          type: boolean
        emailVerified:
          type: boolean
        phoneNumberVerified:
          type: boolean
        onboardingCompleted:
          type: boolean
        numberOfCredentials:
          type: integer
    DeprecatedUserStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: user is enabled when he is enabled in Keycloak AND has at least 2 credentials (1 password + second factor)
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        clientId:
          type: string
        protocol:
          type: string
        enabled:
          type: boolean
          default: true
    RequiredAction:
      type: object
      properties:
        alias:
          type: string
        name:
          type: string
        defaultAction:
          type: boolean
          default: false
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        clientRole:
          type: boolean
        composite:
          type: boolean
        containerId:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    PartialAuthorizations:
      type: object
      properties:
        matrix:
          type: object
          properties:
            authorization:
              type: object
              properties:
                realmName:
                  type: object
                  properties:
                    groupName:
                      type: object
                      properties:
                        qualifier:
                          type: object
    Authorizations:
      type: object
      properties:
        matrix:
          type: object
    AuthorizationResponse:
      type: object
      properties:
        Authorized: 
          type: boolean
    Password:
      type: object
      properties:
        value:
          type: string
    Credential:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        userLabel:
          type: string
        createdDate:
          type: integer
          format: int64
        credentialData:
          type: string
          description: credential data as a JSON-encoded string
        value:
          type: string
        temporary:
          type: boolean
    AttackDetectionStatus:
      type: object
      properties:
        numFailures:
          type: integer
          format: int64
        disabled:
          type: boolean
        lastIPFailure:
          type: string
        lastFailure:
          type: integer
          format: int64
    Configuration:
      type: object
      properties:
        default_client_id:
          type: string
        default_redirect_uri:
          type: string
        api_self_authenticator_deletion_enabled:
          type: boolean
        api_self_password_change_enabled:
          type: boolean
        api_self_account_editing_enabled:
          type: boolean
        api_self_account_deletion_enabled:
          type: boolean
        api_self_idplinks_management_enabled:
          type: boolean
        api_self_initial_password_definition_allowed:
          type: boolean
        show_authenticators_tab:
          type: boolean
        show_password_tab:
          type: boolean
        show_profile_tab:
          type: boolean
        show_account_deletion_button:
          type: boolean
        show_idplinks_tab:
          type: boolean
        self_service_default_tab:
          type: string
        redirect_cancelled_registration_url:
          type: string
        redirect_successful_registration_url:
          type: string
        onboarding_redirect_uri:
          type: string
        onboarding_client_id:
          type: string
        self_register_group_names:
          type: array
          items:
            type: string
        barcode_type:
          type: string
          enum: [CODE128]
        allowed_back_urls:
          type: array
          items:
            type: string
        onboarding_user_editing_enabled:
          type: boolean
        identification_url:
          type: string
    AdminConfiguration:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum: [trustID, corporate]
        available_checks:
          type: object
          additionalProperties:
            type: boolean
        self_register_enabled:
          type: boolean
        consent_required_social:
          type: boolean
        consent_required_corporate:
          type: boolean
        consent_required_corporate_auxiliary:
          type: boolean
        accreditation_renewal_window_days:
          type: integer
        bo_theme:
          type: string
        sse_theme:
          type: string
        register_theme:
          type: string
        signer_theme:
          type: string
        need_verified_contact:
          type: boolean
          description: if true, email and phone number have to be verified to allow validation of the account in KYC
        need_verified_contact_auxiliary:
          type: boolean
        video_identification_voucher_enabled:
          type: boolean
        video_identification_accounting_enabled:
          type: boolean
        video_identification_prepayment_required:
          type: boolean
        auxiliary_video_identification_voucher_enabled: 
          type: boolean
        auxiliary_video_identification_accounting_enabled:
          type: boolean
        auxiliary_video_identification_prepayment_required:
          type: boolean
        auto_identification_voucher_enabled:
          type: boolean
        auto_identification_accounting_enabled:
          type: boolean
        auto_identification_prepayment_required:
          type: boolean
        video_identification_allowed_roles:
          type: array
          items:
            type: string
        auxiliary_video_identification_allowed_roles:
          type: array
          items:
            type: string
        auto_identification_allowed_roles:
          type: array
          items:
            type: string
        physical_identification_allowed_roles:
          type: array
          items:
            type: string
        auxiliary_physical_identification_allowed_roles:
          type: array
          items:
            type: string
        voucher_abuse_counter_button_enabled:
          type: boolean
        onboarding_status_enabled:
          type: boolean
        auto_generated_username_enabled:
          type: boolean
        auto_generated_username_toggle_enabled:
          type: boolean
        register_mode:
          type: string
          enum: [default, advanced, form]
        bo_external_idp_management_enabled:
          type: boolean
    BackOfficeConfiguration:
      type: object
      description: map of target realm -> user type (customers or teams) -> list of allowed group names
      additionalProperties:
        type: object
        properties:
          customers:
            type: array
            items:
              type: string
          teams:
            type: array
            items:
              type: string
        additionalProperties: false
    RealmContextKeyRepresentation:
      type: object
      description: id, label, identitiesRealm and config are mandatory when setting context keys
      required:
      - id
      - label
      - identitiesRealm
      - config
      properties:
        id:
          type: string
        label:
          type: string
        identitiesRealm:
          type: string
        config:
          $ref: '#/components/schemas/CtxKeyConfigRepresentation'
        isRegisterDefault:
          type: boolean
    CtxKeyConfigRepresentation:
      type: object
      properties:
        identificationUri:
          type: string
          format: uri
        onboarding:
          $ref: '#/components/schemas/CtxKeyOnboardingRepresentation'
        accreditation:
          $ref: '#/components/schemas/CtxKeyAccreditationRepresentation'
        autovoucher:
          $ref: '#/components/schemas/CtxKeyAutoVoucherRepresentation'
        idnow:
          $ref: '#/components/schemas/CtxKeyIDNowRepresentation'
    CtxKeyOnboardingRepresentation:
      type: object
      properties:
        clientId:
          type: string
        redirectUri:
          type: string
          format: uri
        isRedirectMode:
          type: boolean
    CtxKeyAccreditationRepresentation:
      type: object
      properties:
        emailThemeRealm:
          type: string
        sponsors:
          type: string
    CtxKeyAutoVoucherRepresentation:
      type: object
      properties:
        serviceType:
          type: string
        validity:
          type: string
        accreditationRequested:
          type: string
        billedRealm:
          type: string
    CtxKeyIDNowRepresentation:
      type: object
      properties:
        desktopRedirectUri:
          type: string
    FederatedIdentity:
      type: object
      properties:
        userID:
          type: string
        username:
          type: string
        identityProvider:
          type: string
          description: read-only. Should be omitted in create/update methods
    IdentityProvider:
      type: object
      properties:
        addReadTokenRoleOnCreate:
          type: boolean
        alias:
          type: string
        authenticateByDefault:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string
        displayName:
          type: string
        enabled:
          type: boolean
        firstBrokerLoginFlowAlias:
          type: string
        hideOnLogin:
          type: boolean
        internalId:
          type: string
        linkOnly:
          type: boolean
        postBrokerLoginFlowAlias:
          type: string
        providerId:
          type: string
        storeToken:
          type: boolean
        trustEmail:
          type: boolean
    Profile:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProfileAttribute'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProfileGroup'
          description: groups are used to gather user attributes by themes
    ProfileAttribute:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        group:
          type: string
          description: name of a group defined in ProfileGroup
        required:
          type: boolean
        readOnly:
          type: boolean
        validations:
          $ref: '#/components/schemas/ProfileAttributeValidations'
        annotations:
          type: object
          additionalProperties:
            type: string
    ProfileAttributeValidations:
      description: >
        Here is a list of known validators :
        email: no parameters
        length: min/max (can be integer or string), trim-disabled (boolean as string)
        integer: min/max (integer as string)
        double: min/max (integer as string)
        options: options (array of allowed values)
        pattern: pattern (regex), error-message (string)
        local-date: no parameters
        uri: no parameters
        username-prohibited-characters: error-message (string)
        person-name-prohibited-characters: error-message (string)
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ProfileAttributeValidator'
    ProfileAttributeValidator:
      type: object
      additionalProperties:
        type: object
    ProfileGroup:
      type: object
      properties:
        name:
          type: string
        displayHeader:
          type: string
        displayDescription:
          type: string
        annotations:
          type: object
          additionalProperties:
            type: string
    ThemeConfiguration:
      type: object
      required:
      - realmName
      - settings
      properties:
        realmName:
          type: string
          description: >
            Realm name. Mandatory and validated as a realm name, but ignored for storage:
            the realm given in the path is always the one updated.
        settings:
          type: object
          description: Mandatory. A missing settings object returns HTTP 400.
          properties:
            color:
              type: string
              description: Hex color code (e.g. \#FFFFFF)
            menuTheme:
              type: string
              enum: [light, dark, primary]
              description: Name of the menu theme to use
            fontFamily:
              type: string
              enum: [Lato, Roboto]
              description: Font family to use for the theme
        logo:
          type: string
          format: byte
          description: logo image (JPEG, PNG or SVG, 1 KB to 5 MB) in base64 format
        favicon:
          type: string
          format: byte
          description: SVG favicon image (1 KB to 1 MB) in base64 format
        translations:
          type: object
          description: >
            Translations, usually keyed by language code (e.g. en, fr, it, de). Any JSON object is accepted
            as long as all its leaf values are strings (nested objects are allowed).
          additionalProperties: true
