        in: path
        description: action
        required: true
        schema:
          type: string
      - name: targetRealm
        in: query
        description: realm name (not id!)
        required: false
        schema:
          type: string
      - name: targetGroupID
        in: query
        description: target group id
        required: false
        schema:
          type: string
