        required: true
        schema:
          type: string
      - name: action
        in: path
        description: action
        required: true
        schema:
          type: string
      - name: targetRealm
        in: query
        description: realm name (not id!)
        required: false
        schema:
          type: string
      - name: targetGroupID
        in: query
        description: target group id
        required: false
        schema:
          type: string
      
      responses:
        200:
          description: successful operation
        400:
          description: invalid information provided
    put:
      tags:
      - Groups
      summary: Add authorizations to the group with a partial matrix
      description: >
        The authorizations added are entirely driven by the body matrix (action -> target realm -> target group).
        The {action} path parameter is NOT used by this operation; the actions are taken from the keys of the matrix.
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: groupID
        in: path
        description: group id
        required: true
        schema:
          type: string
      - name: action
        in: path
        description: action. Ignored by this operation (the actions are read from the body matrix keys).
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
