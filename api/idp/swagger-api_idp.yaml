openapi: 3.0.1
info:
  title: Swagger Cloudtrust Identity Providers
  description: 'Identity Providers API for Cloudtrust'
  version: 1.0.0
servers:
- url: http://localhost:8888
paths:
  /idp/realms/{realm}/identity-providers:
    post:
      tags:
      - Identity providers
      summary: Create an identity provider
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRepresentation'
      responses:
        200:
          description: successful operation
        400:
          description: invalid body content
  /idp/realms/{realm}/identity-providers/{provider}:
    get:
      tags:
      - Identity providers
      summary: Get an identity provider
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation (hrdSettings is not returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderRepresentation'
        404:
          description: provider not found
    put:
      tags:
      - Identity providers
      summary: Update an existing identity provider
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRepresentation'
      responses:
        200:
          description: successful operation
        400:
          description: invalid body content
        404:
          description: provider not found
    delete:
      tags:
      - Identity providers
      summary: Delete an identity provider
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
        404:
          description: provider not found
  /idp/realms/{realm}/identity-providers/{provider}/mappers:
    get:
      tags:
      - Identity providers
      summary: Get the list of mappers of an identity provider
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
        404:
          description: provider not found
    post:
      tags:
      - Identity providers
      summary: Create an identity provider mapper
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
      responses:
        200:
          description: successful operation
        400:
          description: invalid body content
        404:
          description: provider not found
  /idp/realms/{realm}/identity-providers/{provider}/mappers/{mapper}:
    put:
      tags:
      - Identity providers
      summary: Update an identity provider mapper
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      - name: mapper
        in: path
        description: ID of the mapper
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
      responses:
        200:
          description: successful operation
        400:
          description: invalid body content
        404:
          description: mapper not found
    delete:
      tags:
      - Identity providers
      summary: Delete an identity provider mapper
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: alias of the provider
        required: true
        schema:
          type: string
      - name: mapper
        in: path
        description: ID of the mapper
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
        404:
          description: mapper not found
  /idp/realms/{realm}/users:
    get:
      tags:
      - Identity providers
      summary: >
        Search users having a given attribute set to a given value, being member of a given group and/or having a given username.
        At least one of username, groupName or attributeKey/attributeValue must be provided.
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: username
        in: query
        description: username of the user. At least one of username, groupName or attributeKey/attributeValue is required
        required: false
        schema:
          type: string
      - name: groupName
        in: query
        description: name of a group in which searched users are linked to. At least one of username, groupName or attributeKey/attributeValue is required
        required: false
        schema:
          type: string
      - name: attributeKey
        in: query
        description: key of the attribute the searched users have to own. If set, attributeValue is mandatory
        required: false
        schema:
          type: string
      - name: attributeValue
        in: query
        description: value of the attribute. If set, attributeKey is mandatory
        required: false
        schema:
          type: string
      - name: needRoles
        in: query
        description: tells that the response must include realm roles of the users. Default is false
        required: false
        schema:
          type: boolean
      responses:
        200:
          description: successful operation. Returns an empty array when no user matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        400:
          description: invalid or missing parameter, or unknown group
  /idp/realms/{realm}/users/{user}:
    get:
      tags:
      - Identity providers
      summary: Gets a user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: user
        in: path
        description: id of a user
        required: true
        schema:
          type: string
      - name: groupName
        in: query
        description: group the user might be in
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: invalid or missing parameter, or user is not in the given group
        404:
          description: user not found
    delete:
      tags:
      - Identity providers
      summary: Delete a user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: user
        in: path
        description: id of a user
        required: true
        schema:
          type: string
      - name: groupName
        in: query
        description: group the user might be in
        required: false
        schema:
          type: string
      responses:
        200:
          description: successful operation
        400:
          description: unknown group, or user is not in the given group
        404:
          description: user not found
  /idp/realms/{realm}/users/{user}/attributes:
    put:
      tags:
      - Identity provider users
      summary: Updates a user attribute
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: user
        in: path
        description: id of a user
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
      responses:
        204:
          description: successful operation
        400:
          description: invalid body content
        404:
          description: user not found
    delete:
      tags:
      - Identity provider users
      summary: Delete user attributes
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: user
        in: path
        description: id of a user
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        204:
          description: successful operation
        400:
          description: invalid body content
        404:
          description: user not found
  /idp/realms/{realm}/users/{user}/federated-identities:
    get:
      tags:
      - Identity providers
      summary: Get federated identities linked to a user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: user
        in: path
        description: id of a user
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation. Body is null when the user has no federated identity
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/FederatedIdentityRepresentation'
        404:
          description: user not found
  /idp/realms/{realm}/users/{user}/federated-identities/{provider}:
    delete:
      tags:
      - Identity providers
      summary: Remove a federated identity link from a user
      parameters:
      - name: realm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: user
        in: path
        description: User id
        required: true
        schema:
          type: string
      - name: provider
        in: path
        description: Login provider id
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation
components:
  schemas:
    IdentityProviderRepresentation:
      type: object
      required: [alias, displayName, firstBrokerLoginFlowAlias, postBrokerLoginFlowAlias, providerId]
      properties:
          addReadTokenRoleOnCreate:
            type: boolean
          alias:
            type: string
          authenticateByDefault:
            type: boolean
          config:
            type: object
            description: serialized JSON of the config must not exceed 10000 characters
            additionalProperties:
              type: string
          displayName:
            type: string
          enabled:
            type: boolean
          firstBrokerLoginFlowAlias:
            type: string
          hideOnLogin:
            type: boolean
          internalId:
            type: string
          linkOnly:
            type: boolean
          postBrokerLoginFlowAlias:
            type: string
          providerId:
            type: string
          storeToken:
            type: boolean
          trustEmail:
            type: boolean
          hrdSettings:
            description: Write-only. Taken into account by POST/PUT, never returned by GET
            writeOnly: true
            allOf:
              - $ref: '#/components/schemas/HrdSettingModel'
    HrdSettingModel:
      type: object
      required: [priority]
      properties:
          ipRangesList:
            type: string
          domainsList:
            type: string
          priority:
            type: integer
            minimum: -1000
            maximum: 1000
    IdentityProviderMapperRepresentation:
      type: object
      required: [identityProviderAlias, identityProviderMapper, name]
      properties:
          config:
            type: object
            description: serialized JSON of the config must not exceed 10000 characters
            additionalProperties:
              type: string
          id:
            type: string
          identityProviderAlias:
            type: string
          identityProviderMapper:
            type: string
          name:
            type: string
    FederatedIdentityRepresentation:
      type: object
      properties:
        userID:
          type: string
        username:
          type: string
        identityProvider:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        enabled:
          type: boolean
          default: true
        roles:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: http://toto.com/.well-known/openid-configuration
security:
  - openId:
    - todo
