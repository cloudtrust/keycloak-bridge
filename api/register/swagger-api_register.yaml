openapi: 3.0.1
info:
  title: Swagger Cloudtrust Register
  description: 'Self-register API for Cloudtrust.'
  version: 1.0.0
servers:
- url: http://localhost:8855
tags:
- name: Register
  description: Self registering of a user
paths:
  /register/user:
    post:
      tags:
      - Register
      summary: Creates a user in the configured realm (register-realm)
      security:
        - Recaptcha: []
      parameters:
      - name: realm
        in: query
        description: realm name (not id!) of a realm configured with a redirect URL for the end of the process
        required: true
        schema:
          type: string
      - name: context-key
        in: query
        description: context-key
        required: false
        schema:
          type: string
          pattern: '^[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}$'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: Successful operation in redirect mode (enabled by the context key). Returns the URL the end-user has to be redirected to
          content:
            application/json:
              schema:
                type: string
        204:
          description: Successful operation
        400:
          description: Invalid information provided (missing realm, invalid body or invalid context-key)
        403:
          description: Missing or invalid RECAPTCHA token
        409:
          description: Self-register is not enabled or not configured for the realm
  /register/user/profile:
    get:
      tags:
      - Configuration
      summary: Gets the definition of user attributes of the configured realm (register-realm)
      responses:
        200:
          description: successful operation. Returns the realm users profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /register/realms/{corpRealm}/user:
    post:
      tags:
      - Register
      summary: Creates a user in the realm specified in URL path
      security:
        - Recaptcha: []
      parameters:
      - name: corpRealm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      - name: context-key
        in: query
        description: context-key
        required: false
        schema:
          type: string
          pattern: '^[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}$'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: Successful operation in redirect mode (enabled by the context key). Returns the URL the end-user has to be redirected to
          content:
            application/json:
              schema:
                type: string
        204:
          description: Successful operation
        400:
          description: Invalid information provided (invalid body or invalid context-key)
        403:
          description: Missing or invalid RECAPTCHA token
        409:
          description: Self-register is not enabled or not configured for the realm
  /register/realms/{corpRealm}/user/profile:
    get:
      tags:
      - Configuration
      summary: Gets the definition of user attributes from the realm specified in URL path
      parameters:
      - name: corpRealm
        in: path
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation. Returns the realm users profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /register/config:
    get:
      tags:
      - Configuration
      summary: Gets configuration
      parameters:
      - name: realm
        in: query
        description: realm name (not id!)
        required: true
        schema:
          type: string
      responses:
        200:
          description: successful operation. Returns the configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
components:
  schemas:
    User:
      type: object
      description: >
        Required fields and their validation rules are defined by the realm user profile (see the profile endpoints).
        Additional attributes defined in the realm user profile are accepted as top-level properties.
      additionalProperties: true
      properties:
        username:
          type: string
        gender:
          type: string
          enum: [M,F,U]
          description: Male, Female or Undefined
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        birthDate:
          type: string
          description: format is DD.MM.YYYY
        birthLocation:
          type: string
        nationality:
          type: string
          description: ISO 3166 Alpha-2 country code
        idDocumentType:
          type: string
          enum: [ID_CARD, PASSPORT, RESIDENCE_PERMIT]
        idDocumentNumber:
          type: string
        idDocumentExpiration:
          type: string
        idDocumentCountry:
          type: string
          description: ISO 3166 Alpha-2 country code
        locale:
          type: string
        businessId:
          type: string
          description: Business identifier (can be GLN)
        onboardingStatus:
          type: string
          enum: ["", self-registration-form-completed, user-created-by-api, email-verified, password-set, phone-verified, 2fa-set, completed]
          description: user onboarding flow status
    Configuration:
      type: object
      properties:
        redirect_cancelled_registration_url:
          type: string
        mode:
          type: string
          description: is the register API used for corporate or social mode
        theme:
          type: string
        supportedLocales:
          type: array
          items:
            type: string
        selfRegisterEnabled:
          type: boolean
          description: true if self register is enabled for the specified realm
        contextKey:
          type: string
          description: context key of the specified realm
        registerMode:
          type: string
    Profile:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProfileAttribute'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProfileGroup'
          description: groups are used to gather user attributes by themes
    ProfileAttribute:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        group:
          type: string
          description: name of a group defined in ProfileGroup
        required:
          type: boolean
        readOnly:
          type: boolean
        validations:
          $ref: '#/components/schemas/ProfileAttributeValidations'
        annotations:
          type: object
          additionalProperties:
            type: string
    ProfileAttributeValidations:
      description: >
        Here is a list of known validators :
        email: no parameters
        length: min/max (can be integer or string), trim-disabled (boolean as string)
        integer: min/max (integer as string)
        double: min/max (integer as string)
        options: options (array of allowed values)
        pattern: pattern (regex), error-message (string)
        local-date: no parameters
        uri: no parameters
        username-prohibited-characters: error-message (string)
        person-name-prohibited-characters: error-message (string)
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ProfileAttributeValidator'
    ProfileAttributeValidator:
      type: object
      additionalProperties:
        type: object
    ProfileGroup:
      type: object
      properties:
        name:
          type: string
        displayHeader:
          type: string
        displayDescription:
          type: string
        annotations:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    Recaptcha:
      type: apiKey
      in: header
      name: Authorization
      description: raw RECAPTCHA token (no scheme prefix), must match ^[\w\d-]+$
